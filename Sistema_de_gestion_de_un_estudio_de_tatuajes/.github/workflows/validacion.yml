name: Validación Proyecto
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar archivos principales
        run: |
          archivos=("index.html" "Disenos.html" "Tatuadores.html" "js/Disenos.js" "js/Tatuadores.js")
          for archivo in "${archivos[@]}"; do
            if [ -f "$archivo" ]; then
              echo "✅ $archivo existe"
            else
              echo "❌ FALTA: $archivo"
              exit 1
            fi
          done
          echo "✅ Todos los archivos están presentes"